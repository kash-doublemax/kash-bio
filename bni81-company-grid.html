<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客製化數據變現系統｜BNI 81 宮格公司引薦地圖</title>
  <style>
    :root {
      --ink: #12314a;
      --muted: #60768a;
      --line: #b8cad8;
      --company-bg: #f7fbfd;
      --company-line: #c7d8e4;
      --company-accent: #0f6b91;
      --target-bg: #fff2cf;
      --target-line: #d69821;
      --target-ink: #6a4100;
      --scenario-bg: #e8f3f8;
      --scenario-line: #74a9c7;
      --core-bg: #70430b;
      --core-line: #4b2b05;
      --core-accent: #ffcf45;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 2800px;
      min-height: 3000px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      letter-spacing: 0;
    }

    body { padding: 64px 80px 72px; }

    header {
      height: 190px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 56px;
    }

    h1 {
      margin: 0 0 16px;
      color: #102e45;
      font-size: 50px;
      line-height: 1.15;
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 26px;
      line-height: 1.4;
      font-weight: 650;
    }

    .legend {
      display: flex;
      gap: 22px;
      padding-top: 10px;
      white-space: nowrap;
      font-size: 22px;
      font-weight: 800;
    }

    .legend-item { display: flex; align-items: center; gap: 10px; }
    .swatch { width: 28px; height: 28px; border-radius: 5px; border: 2px solid; }
    .swatch.core { background: var(--core-bg); border-color: var(--core-line); }
    .swatch.target { background: var(--scenario-bg); border-color: var(--scenario-line); }
    .swatch.company { background: var(--company-bg); border-color: var(--company-line); }

    .map {
      width: 2640px;
      height: 2640px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 24px;
    }

    .block {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
      overflow: hidden;
      background: #9fb5c5;
      border: 3px solid #8da6b8;
      border-radius: 8px;
    }

    .cell {
      min-width: 0;
      min-height: 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .company {
      background: var(--company-bg);
      color: #173c56;
      border: 2px solid var(--company-line);
    }

    .company .type {
      color: #2f526b;
      font-size: 20px;
      line-height: 1.24;
      font-weight: 800;
    }

    .company .name {
      margin-top: 12px;
      color: var(--company-accent);
      font-size: 26px;
      line-height: 1.18;
      font-weight: 900;
    }

    .target {
      padding: 13px;
      background: var(--target-bg);
      color: var(--target-ink);
      border: 4px solid var(--target-line);
    }

    .target .audience {
      font-size: 22px;
      line-height: 1.26;
      font-weight: 900;
    }

    .target .solution {
      margin-top: 10px;
      color: #a75e00;
      font-size: 20px;
      line-height: 1.23;
      font-weight: 900;
    }

    .center-block { background: #6f9db8; border-color: #557f99; }

    .center-block .scenario {
      padding: 12px;
      background: var(--scenario-bg);
      color: #173f5a;
      border: 3px solid var(--scenario-line);
    }

    .scenario .audience {
      font-size: 22px;
      line-height: 1.24;
      font-weight: 900;
    }

    .scenario .solution {
      margin-top: 10px;
      color: #a85c00;
      font-size: 20px;
      line-height: 1.22;
      font-weight: 900;
    }

    .core {
      padding: 14px;
      background: var(--core-bg);
      color: #fff;
      border: 5px solid var(--core-line);
    }

    .core .name {
      margin-bottom: 13px;
      color: #fff6dd;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 900;
    }

    .core .service {
      color: var(--core-accent);
      font-size: 28px;
      line-height: 1.24;
      font-weight: 900;
    }

    footer {
      height: 70px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      color: #65798a;
      font-size: 20px;
      line-height: 1.35;
    }

    footer strong { color: #173c56; }
  </style>
</head>

    const map = document.querySelector("#map");

    function makeCell(className, content) {
      const cell = document.createElement("div");
      cell.className = `cell ${className}`;
      cell.innerHTML = content;
      return cell;
    }

    blocks.forEach((block) => {
      const blockEl = document.createElement("section");
      blockEl.className = `block${block.core ? " center-block" : ""}`;

      const entries = block.core ? block.scenarios : block.companies;
      const positions = [0, 1, 2, 3, 5, 6, 7, 8];

      entries.forEach((entry, index) => {
        const pos = positions[index];
        const item = block.core
          ? `<div class="audience">${entry[0]}</div><div class="solution">${entry[1]}</div>`
          : `<div class="type">${entry[0]}</div><div class="name">${entry[1]}</div>`;
        const cell = makeCell(block.core ? "scenario" : "company", item);
        cell.style.gridArea = `${Math.floor(pos / 3) + 1} / ${(pos % 3) + 1}`;
        blockEl.appendChild(cell);
      });

      const center = block.core
        ? makeCell("core", `<div class="name">${block.core[0]}</div><div class="service">${block.core[1]}</div>`)
        : makeCell("target", `<div class="audience">${block.target[0]}</div><div class="solution">${block.target[1]}</div>`);
      center.style.gridArea = "2 / 2";
      blockEl.appendChild(center);
      map.appendChild(blockEl);

</html>
